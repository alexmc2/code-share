services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - '80:80'
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGINS=http://localhost,http://localhost:80
    restart: unless-stopped
